<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#fbf1cc">
<title>معصوبي — اطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --crumple:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='720'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.009 .014' numOctaves='5' seed='23' result='n'/><feDiffuseLighting in='n' lighting-color='%23fff' surfaceScale='5' diffuseConstant='1'><feDistantLight azimuth='235' elevation='55'/></feDiffuseLighting><feComponentTransfer><feFuncR type='linear' slope='.4' intercept='.64'/><feFuncG type='linear' slope='.4' intercept='.64'/><feFuncB type='linear' slope='.4' intercept='.645'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  /* hand-drawn doodles like the cup print: banana, honeycomb, almonds, honey dipper */
  --doodle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' fill='none' stroke='rgba(120,92,10,.16)' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M24 70c18 30 62 34 86 6M24 70c10 10 30 18 50 16M110 76c4-6 4-10 2-14'/><path d='M168 20l14 8v16l-14 8-14-8V28zM182 44l14 8v16l-14 8-14-8M154 44v16l14 8M196 28l14 8v16l-14 8'/><ellipse cx='70' cy='182' rx='16' ry='9' transform='rotate(-30 70 182)'/><path d='M60 188c6-4 14-8 20-12'/><ellipse cx='98' cy='196' rx='14' ry='8' transform='rotate(20 98 196)'/><path d='M190 150l40 66M178 132c6-6 16-6 22 0s6 16 0 22-16 6-22 0-6-16 0-22zM176 140l26 0M174 148l30 2'/></svg>");
  --torn:linear-gradient(#000 0 0);
  --scallop:none;
  --ink:#1b1814; --mute:#8a7f69; --line:rgba(27,24,20,.13);
  --yel:#ffd21f; --cream:#fbf1cc;
  --ui:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,monospace;
  --disp:'Lalezar','IBM Plex Sans Arabic',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sheet:420px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{
  position:fixed;inset:0;font-family:var(--ui);color:var(--ink);
  background:var(--doodle) 0 0/260px 260px,var(--cream);
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.stk{font-family:var(--disp);font-weight:400;
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff,0 4px 10px rgba(0,0,0,.12)}

#tint{
  position:fixed;z-index:0;left:50%;top:46%;width:min(80vw,640px);aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);filter:blur(70px);opacity:.5;background-color:var(--yel);
  transition:background-color 1s ease,opacity .8s,left .8s var(--ease),top .8s var(--ease);pointer-events:none;
}
body.grid #tint{opacity:.2}
body.focus #tint{opacity:.7}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;height:62px;z-index:50;padding:0 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.brand img{height:26px;width:auto;display:block}
.brand small{font-size:9.5px;color:var(--mute);white-space:nowrap}
#toggle{display:flex;background:rgba(27,24,20,.07);border-radius:999px;padding:3px;transition:opacity .3s}
#toggle button{font-size:12px;font-weight:500;padding:6px 14px;border-radius:999px;color:var(--mute);transition:.25s}
#toggle button.on{background:var(--ink);color:var(--yel)}
#bag{justify-self:end;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--yel);box-shadow:0 0 0 1.5px var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center}
#bag.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.12)}}
body.focus #toggle{opacity:0;pointer-events:none}

/* ---------- stage + items ---------- */
#stage{position:fixed;inset:0;z-index:1;touch-action:none;cursor:grab}
body.grid #stage{cursor:default}
#stage.drag{cursor:grabbing}
.item{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity;cursor:pointer}
.item img.art{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 14px 16px rgba(80,55,0,.18))}
.item .new{position:absolute;top:4%;right:2%;transform:rotate(8deg) scale(var(--inv,1));transform-origin:right top;background:var(--ink);color:var(--yel);font:400 15px var(--disp);padding:3px 12px 1px;border-radius:999px;pointer-events:none}
.gcap{position:absolute;left:50%;top:100%;margin-top:6px;white-space:nowrap;text-align:center;
  transform:translateX(-50%) scale(var(--inv,1));transform-origin:50% 0;font:400 17px var(--disp);opacity:0;transition:opacity .4s;pointer-events:none}
.gcap span{font:12px var(--mono);color:var(--mute);margin-left:6px}
body.grid:not(.focus) .gcap{opacity:1}

/* hotspots */
.item .spots{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;width:0;height:0;pointer-events:none;opacity:0}
.item.spots-on .spot{pointer-events:auto;opacity:1}
.spot .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%) scale(var(--inv,1));
  background:var(--ink);color:var(--yel);font:500 10px/28px var(--mono);text-align:center;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 6px 16px rgba(0,0,0,.25);transition:background .2s,color .2s}
.item.spots-on .spot .dot{animation:pop .45s var(--ease) backwards;animation-delay:calc(var(--k) * 110ms + 80ms)}
.spot .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);animation:ring 2.2s ease-out infinite;animation-delay:calc(var(--k) * 300ms)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
.pill{position:absolute;top:0;white-space:nowrap;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.16);opacity:0;transition:opacity .25s,transform .3s var(--ease);pointer-events:none}
.pill em{font-style:normal;font-family:var(--mono);color:var(--mute);margin-inline-start:6px}
.spot.r .pill{left:0;transform-origin:left center;transform:translate(calc(18px * var(--inv,1)),-50%) scale(calc(var(--inv,1) * .9))}
.spot.l .pill{right:0;transform-origin:right center;transform:translate(calc(-18px * var(--inv,1)),-50%) scale(calc(var(--inv,1) * .9))}
.spot.on .pill{opacity:1}
.spot.r.on .pill{transform:translate(calc(20px * var(--inv,1)),-50%) scale(var(--inv,1))}
.spot.l.on .pill{transform:translate(calc(-20px * var(--inv,1)),-50%) scale(var(--inv,1))}
.spot.on .dot{background:var(--yel);color:var(--ink);box-shadow:0 0 0 4px var(--ink),0 6px 16px rgba(0,0,0,.25)}

/* ---------- dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 18px 18px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"info shop";gap:12px 10px;align-items:end;transition:opacity .35s,transform .45s var(--ease)}
body.grid #dock,body.focus #dock{opacity:0;transform:translateY(24px);pointer-events:none}
.d-info{grid-area:info;min-width:0}
.d-idx{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mute);direction:ltr;justify-content:flex-end}
#play{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
#play svg{width:9px;height:9px;fill:var(--ink)}
#dname{font-size:34px;line-height:1.25;margin-top:2px;white-space:nowrap}
#dname small{display:block;font:11px var(--mono);letter-spacing:.14em;color:var(--mute);margin-top:-2px;text-shadow:none}
.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
#shop{grid-area:shop;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;padding-bottom:4px}
#shop i{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--yel);display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:300;transition:transform .2s}
#shop:active i{transform:scale(.92)}

/* ---------- focus ---------- */
#ftitle{position:fixed;z-index:30;top:66px;right:20px;font-size:32px;opacity:0;transform:translateY(8px);transition:.45s var(--ease);pointer-events:none}
#ftitle span{font:18px var(--mono);color:var(--mute);margin-left:8px;text-shadow:none}
#close{position:fixed;z-index:31;top:70px;left:16px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);display:grid;place-items:center;font-size:18px;opacity:0;transform:scale(.8);transition:.35s var(--ease);pointer-events:none}
#hint{position:fixed;z-index:30;left:0;right:0;text-align:center;font-size:12px;color:#6f6553;opacity:0;transition:opacity .4s;pointer-events:none}
body.focus #ftitle{opacity:1;transform:none}
body.focus #close{opacity:1;transform:none;pointer-events:auto}
body.focus.hot #hint{opacity:1}

/* ---------- focus receipt (ticket) ---------- */
#receipt{position:fixed;z-index:40;color:var(--ink);overflow-y:auto;overscroll-behavior:contain;transition:transform .6s var(--ease);touch-action:pan-y;scrollbar-width:none;
  background:transparent;padding:14px 14px 0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12)) drop-shadow(0 10px 14px rgba(0,0,0,.12)) drop-shadow(0 28px 40px rgba(0,0,0,.14))}
#receipt::-webkit-scrollbar{display:none}
@media (max-width:759px){
  #receipt{left:0;right:0;bottom:0;max-height:var(--sheet);transform:translateY(105%)}
  #receipt::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(0,0,0,.18);margin:0 auto 8px}
  body.focus #receipt{transform:none}
  #hint{bottom:calc(var(--sheet) + 12px)}
}
@media (min-width:760px){
  #receipt{top:76px;left:20px;width:350px;max-height:calc(100% - 96px);transform:translateX(-120%)}
  body.focus #receipt{transform:none;transition-delay:.12s}
  #close{left:388px}
  #hint{bottom:26px;padding-left:370px}
  #ftitle{font-size:42px;top:74px;right:32px}
  #dock{padding:0 28px 26px;gap:24px}
  #dname{font-size:44px}
}
.tk{position:relative;color:#26231f}
.tk-paper{background-color:#fffaf0;background-image:var(--grain),linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(0,0,0,.035) 100%)}
.tk-top{position:relative;border-radius:16px 16px 0 0;padding:14px 14px 18px;overflow:hidden;color:var(--ink);background:var(--doodle) 0 0/200px 200px,var(--yel)}
.tk-top::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.3) 45%,rgba(255,255,255,0) 60%)}
.tk-frame{position:relative;z-index:1;border:1.5px solid rgba(27,24,20,.55);border-radius:10px;padding:12px 14px 16px;min-height:178px}
.tk-frame::before{content:"";position:absolute;inset:3px;border:1px dashed rgba(27,24,20,.3);border-radius:7px;pointer-events:none}
.tk-head{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--ui)}
.tk-no{font:700 13px 'Courier Prime',var(--mono);color:var(--yel);background:var(--ink);padding:2px 8px;border-radius:4px;direction:ltr}
.tk-name{font:400 30px/1.1 var(--disp);margin-top:14px;max-width:58%}
.tk-en{font:700 11px 'Courier Prime',var(--mono);letter-spacing:.14em;opacity:.75;margin-top:5px;direction:ltr;text-align:right;max-width:58%}
.tk-price{display:inline-flex;align-items:baseline;gap:4px;margin-top:14px;padding:4px 12px;background:#fff;border-radius:999px;font:700 18px 'Courier Prime',var(--mono)}
.tk-price small{font:500 11px var(--ui)}
.tk-img{position:absolute;z-index:1;left:6px;top:50%;width:44%;transform:translateY(-50%) rotate(-6deg);filter:drop-shadow(0 12px 14px rgba(0,0,0,.25));pointer-events:none}
.tk-img.wide{width:50%;left:-4px}
.tk-side{position:absolute;z-index:2;left:7px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font:700 9px 'Courier Prime',var(--mono);letter-spacing:.3em;color:rgba(27,24,20,.55);white-space:nowrap;direction:ltr}
.tk-perf{position:relative;height:20px;
  -webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 97%,#000),radial-gradient(circle 10px at 100% 50%,#0000 97%,#000),radial-gradient(circle,#0000 1.9px,#000 2.5px) center/9px 100% repeat-x;
  -webkit-mask-composite:source-in,source-in;
  mask:radial-gradient(circle 10px at 0 50%,#0000 97%,#000) intersect,radial-gradient(circle 10px at 100% 50%,#0000 97%,#000) intersect,radial-gradient(circle,#0000 1.9px,#000 2.5px) center/9px 100% repeat-x}
.tk-perf.top-c{background:#e8bd12}
.tk-body{padding:4px 16px 16px}
.tk-sec{display:flex;justify-content:space-between;font:700 10px 'Courier Prime',var(--mono);letter-spacing:.22em;color:#8c8478;margin:8px 0 4px;direction:ltr}
.rc-row{display:flex;align-items:center;gap:12px;padding:10px 8px;margin:0 -8px;border-radius:10px;transition:background .25s;cursor:pointer}
.rc-row + .rc-row{border-top:1px dashed rgba(38,35,31,.14);border-radius:0}
.rc-row.hl{background:rgba(255,210,31,.18)}
.tk-it{flex:1;min-width:0}
.tk-it b{display:block;font-size:14px;font-weight:600}
.tk-it small{font-size:11px;color:#8c8478}
.tk-p{font:700 15px 'Courier Prime',var(--mono);direction:ltr}
.rc-add{position:relative;flex:0 0 auto;width:26px;height:26px;padding:0;border-radius:50%;font-size:0;border:1.6px dashed #b9b0a3;background:transparent;transition:border-color .2s}
.rc-add::before{content:"+";position:absolute;inset:0;display:grid;place-items:center;font:500 15px/1 var(--ui);color:#a39a8c}
.rc-add.in{border:0;background:radial-gradient(circle at 50% 38%,#3d3935,#141210 70%);box-shadow:inset 0 2px 3px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.9);animation:punch .35s var(--ease)}
.rc-add.in::before{content:""}
.rc-add.in::after{content:"";position:absolute;left:5px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--yel);box-shadow:0 1px 2px rgba(0,0,0,.3);animation:chad .6s ease-in forwards}
@keyframes punch{0%{transform:scale(1.35)}60%{transform:scale(.92)}}
@keyframes chad{to{transform:translate(10px,46px) rotate(140deg) scale(.7);opacity:0}}
.tk-tot{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:12px;border-top:2px solid #26231f}
.tk-tot b{font-size:14px}
.tk-tot i{flex:1;border-bottom:2px dotted #b9b0a3;transform:translateY(-4px)}
.tk-tot span{font:700 26px 'Courier Prime',var(--mono);direction:ltr}
.tk-tot small{font:500 11px var(--ui);color:#8c8478}
.tk-vat{font-size:10.5px;color:#8c8478;margin-top:3px}
.rc-cta{width:100%;margin-top:14px;height:50px;border-radius:12px;background:var(--ink);color:var(--yel);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .3s}
.rc-cta:active{transform:scale(.98)}
.rc-cta.done{background:#3c6b2e;color:#fff}
.tk-stamp{position:absolute;z-index:3;left:14px;top:-22px;width:84px;height:84px;border-radius:50%;overflow:hidden;border:2.5px solid #8a6a00;color:#8a6a00;display:grid;place-items:center;text-align:center;transform:rotate(-16deg);opacity:.6;pointer-events:none}
.tk-stamp::before{content:"";position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%}
.tk-stamp::after{content:"";position:absolute;inset:-6px;opacity:.55;background:radial-gradient(#fffaf0 1px,transparent 1.7px) 0 0/7px 9px,radial-gradient(#fffaf0 .8px,transparent 1.3px) 3px 4px/11px 6px}
.tk-stamp b{display:block;font:400 21px/1 var(--disp)}
.tk-stamp small{display:block;font:700 7.5px 'Courier Prime',var(--mono);letter-spacing:.25em;margin-top:3px;direction:ltr}
.tk-stub{display:flex;align-items:center;gap:12px;padding:12px 16px 16px;border-radius:0 0 16px 16px}
.tk-stub .barcode{flex:1;height:38px;margin:0}
.tk-stub div{text-align:left;direction:ltr}
.tk-stub b{display:block;font:700 15px 'Courier Prime',var(--mono)}
.tk-stub small{display:block;font:500 9.5px var(--ui);color:#8c8478;direction:rtl;text-align:right}
.barcode{display:block;width:100%;height:48px;margin:18px 0 6px}

/* ---------- ring labels ---------- */
.band{position:fixed;z-index:12;right:16px;display:flex;align-items:baseline;gap:6px;padding:4px 0;opacity:.45;transition:opacity .3s,top .4s}
.band b{font:400 17px var(--disp)}
.band span{font:500 9.5px var(--mono);letter-spacing:.25em;color:var(--mute)}
.band::after{content:"";width:22px;height:1.5px;background:currentColor;opacity:.4;align-self:center}
.band.on{opacity:1}
body.grid .band,body.focus .band{opacity:0;pointer-events:none}

/* ---------- spec callouts ---------- */
#spec{position:fixed;inset:0;z-index:14;pointer-events:none;color:var(--ink);transition:opacity .35s}
body.grid #spec,body.focus #spec{opacity:0}
body.grid #spec *,body.focus #spec *{pointer-events:none !important}
#spLines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#spLines polyline{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:420;stroke-dashoffset:0;opacity:.75}
#spLines circle{fill:var(--yel);stroke:var(--ink);stroke-width:1.6}
#spec.in #spLines polyline{animation:drawl .7s cubic-bezier(.3,.7,.2,1) backwards;animation-delay:calc(var(--k) * 90ms + 120ms)}
#spec.in #spLines circle{animation:dotin .4s var(--ease) backwards;animation-delay:calc(var(--k) * 90ms)}
@keyframes drawl{from{stroke-dashoffset:420}}
@keyframes dotin{from{r:0}}
.sp-l{position:absolute;left:0;top:0;max-width:var(--lw,190px);text-align:right;pointer-events:auto;padding:2px 0;line-height:1.35;will-change:transform}
.sp-l b{display:block;font-size:12.5px;font-weight:700}
.sp-l span{display:block;font-size:10.5px;color:#5d5444}
.sp-l em{display:inline-block;margin-top:3px;font:normal 700 10.5px 'Courier Prime',var(--mono);background:var(--yel);border:1px solid var(--ink);border-radius:999px;padding:1px 8px;direction:rtl}
#spec.in .sp-l{animation:labin .5s var(--ease) backwards;animation-delay:calc(var(--k) * 90ms + 300ms)}
@keyframes labin{from{opacity:0}}
#spHead{position:absolute;left:24px;top:74px;width:210px;text-align:right}
#spHead b{display:block;font:400 26px var(--disp)}
#spHead .sp-pill{display:inline-block;margin-top:6px;padding:3px 14px;background:var(--ink);color:var(--yel);border-radius:999px;font-size:11.5px;font-weight:600}
#spHead p{margin:10px 0 0;font-size:12px;line-height:1.6;color:#4d4536}
/* the price badge: same white scalloped sticker as their menu posts */
#spStamp{position:absolute;left:0;top:0;width:96px;height:96px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;pointer-events:auto;
  background:var(--scallop) center/100% 100% no-repeat;filter:drop-shadow(0 8px 14px rgba(0,0,0,.14))}
#spStamp small{font-size:9.5px;font-weight:600}
#spStamp b{font:700 26px 'Courier Prime',var(--mono)}
#spec.in #spStamp{animation:stampin .6s cubic-bezier(.3,1.5,.5,1) backwards .45s}
@keyframes stampin{from{opacity:0;scale:.6}}
@media (max-width:759px){
  #spHead{display:none}
  .sp-l b{font-size:11px}.sp-l span{font-size:9.5px}.sp-l em{font-size:9.5px}
  #spStamp{width:80px;height:80px}#spStamp b{font-size:21px}
}

/* ================= CART ================= */
#scrim{position:fixed;inset:0;z-index:56;background:rgba(27,24,20,.3);opacity:0;pointer-events:none;transition:opacity .4s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
body.cart #scrim{opacity:1;pointer-events:auto}
#cart{position:fixed;z-index:58;display:flex;flex-direction:column;background:var(--doodle) 0 0/260px 260px,var(--cream);color:var(--ink);transition:transform .65s var(--ease);box-shadow:0 30px 90px rgba(0,0,0,.25);overflow:hidden}
#cart::before{content:"";position:absolute;inset:-20% -30% auto;height:60%;background:radial-gradient(closest-side,var(--yel),transparent);opacity:.45;filter:blur(30px);pointer-events:none}
.c-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.c-head h2{margin:0;font:400 30px var(--disp)}
.c-head h2 small{font:12px var(--mono);color:var(--mute);margin-right:8px}
.c-x{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:16px}
.c-body{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 24px;touch-action:pan-y;scrollbar-width:none}
.c-body::-webkit-scrollbar{display:none}
/* the counter: what's in the bag sits on a shelf */
.rack{position:relative;height:150px;margin:4px -18px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
.rack::-webkit-scrollbar{display:none}
.rod{position:absolute;left:14px;right:14px;bottom:10px;height:12px;border-radius:6px;background:linear-gradient(#ffe36a,var(--yel) 40%,#d9ab00);box-shadow:0 6px 10px rgba(120,90,0,.25),inset 0 1px 0 rgba(255,255,255,.6)}
.hangs{position:relative;display:flex;gap:14px;padding:0 26px 18px;min-width:100%;justify-content:center;align-items:flex-end;height:100%}
.hang{position:relative;flex:0 0 auto;cursor:pointer}
.hang img{display:block;height:100px;width:auto;max-width:150px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16));-webkit-user-drag:none}
.hang.wide img{height:auto;width:130px}
.hang .q{position:absolute;top:-6px;left:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--ink);color:var(--yel);font:500 11px/26px var(--mono);text-align:center;box-shadow:0 0 0 3px var(--cream)}
.hang.pop{animation:drop .7s var(--ease) both}
@keyframes drop{from{transform:translateY(-50px) rotate(-8deg);opacity:0}60%{transform:translateY(4px) rotate(2deg);opacity:1}}

.c-rc{position:relative;margin:10px 4px 0}
.c-slot{position:relative;z-index:2;height:22px;margin:0 -10px;border-radius:11px;background:linear-gradient(#2b2b30,#0c0c0e 55%,#000);box-shadow:0 8px 16px rgba(0,0,0,.28),0 0 22px 2px rgba(255,210,31,.18),inset 0 0 0 1px rgba(255,255,255,.07)}
.c-slot::before{content:"";position:absolute;left:8px;right:8px;top:2px;height:7px;border-radius:6px;background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0))}
.c-slot::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(255,210,31,0),#ffd21f 18%,#fff6c4 50%,#ffd21f 82%,rgba(255,210,31,0));box-shadow:0 0 6px 1px rgba(255,210,31,.55)}
.c-paper-w{margin-top:-6px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08)) drop-shadow(0 14px 22px rgba(0,0,0,.1))}
.crumpled{background-color:#f1f1ef;background-image:var(--grain),var(--crumple);background-size:160px 160px,cover;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,var(--torn) bottom/100% 10px no-repeat;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,var(--torn) bottom/100% 10px no-repeat}
.c-paper{position:relative;padding:22px 16px 30px;color:#2a2a2a}
.c-paper::before{content:"";position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(rgba(255,210,31,.3),rgba(255,210,31,0));pointer-events:none}
.c-paper.print{animation:print 1s steps(20) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.cr-h{display:flex;justify-content:center}.cr-h img{height:30px;width:auto}
.cr-m{text-align:center;font:10px/1.6 var(--mono);color:#6d6a64;margin-top:4px;direction:ltr}
.cr-rule{border-top:1.3px dashed rgba(30,30,30,.5);margin:12px 0}
.cl{padding:8px 0;transition:opacity .3s,transform .3s}
.cl + .cl{border-top:1px dotted rgba(30,30,30,.2)}
.cl.out{opacity:0;transform:translateX(-30px)}
.cl-top{display:flex;align-items:baseline;gap:8px}
.cl-top .n{font:10px var(--mono);color:#888}
.cl-top b{flex:1;font-size:14px;font-weight:600}
.cl-top em{font:normal 11px var(--mono);color:#6d6a64}
.cl-top .amt{font:500 14px var(--mono);min-width:34px;text-align:left}
.cl-x{display:flex;justify-content:space-between;font-size:11.5px;color:#55524d;padding:2px 22px 0 0}
.cl-x span:last-child{font-family:var(--mono)}
.cl-ctl{display:flex;align-items:center;gap:6px;padding:8px 22px 0 0}
.stp{display:flex;align-items:center;border:1px solid rgba(27,24,20,.25);border-radius:999px;overflow:hidden}
.stp button{width:30px;height:26px;font-size:15px}
.stp button:active{background:rgba(0,0,0,.06)}
.stp span{min-width:22px;text-align:center;font:500 12px var(--mono)}
.rm{font-size:11px;color:#a33;padding:4px 8px;margin-right:auto}
.cr-sum{display:flex;justify-content:space-between;font-size:12px;color:#55524d;margin:5px 0}
.cr-sum span:last-child{font-family:var(--mono)}
.cr-sum .tx{font-family:var(--ui) !important;color:var(--ink);font-weight:500}
.cr-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.cr-tot span:first-child{font-size:16px;font-weight:700}
.cr-tot span:last-child{font:500 30px var(--mono);direction:ltr}
.cr-tot small{font:12px var(--ui);color:#6d6a64}
.c-paper .barcode{width:70%;margin:16px auto 4px;height:40px}
.cr-code{font:10px var(--mono);letter-spacing:.3em;text-align:center;color:#555;direction:ltr}
.opt{margin-top:22px}
.opt h4{margin:0 0 8px;font-size:12px;font-weight:600;color:#55514b}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid rgba(27,24,20,.08);font-size:12.5px;font-weight:500;transition:.2s;display:flex;align-items:center;gap:7px}
.chips button small{font:10px var(--mono);color:var(--mute)}
.chips button.on{background:var(--ink);color:var(--yel);border-color:var(--ink)}
.chips button.on small{color:rgba(255,210,31,.7)}
.c-note{display:block;width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px dashed rgba(27,24,20,.25);background:rgba(255,255,255,.55);font:13px var(--ui);color:var(--ink);resize:none;outline:none;-webkit-user-select:text;user-select:text}
.c-foot{position:relative;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(251,241,204,0),var(--cream) 30%)}
#pay{width:100%;height:56px;border-radius:16px;background:var(--ink);color:var(--yel);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 20px;transition:transform .15s,opacity .3s}
#pay:active{transform:scale(.98)}
#pay span:last-child{font:500 15px var(--mono)}
.c-empty{text-align:center;padding:40px 20px}
.c-empty img{height:130px;width:auto;filter:grayscale(1) brightness(1.25) contrast(.7);opacity:.4}
.c-empty p{color:var(--mute);font-size:13px;margin:14px 0 18px}
.c-empty button{padding:11px 20px;border-radius:999px;background:var(--ink);color:var(--yel);font-size:13px;font-weight:600}

/* order placed: the dishes come out steaming */
.c-done{text-align:center;padding:10px 6px 30px}
.fills{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:44px auto 0}
.fill{position:relative;animation:drop .8s var(--ease) both;animation-delay:var(--d)}
.fill img{display:block;height:var(--h);width:auto;max-width:42vw;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.18));-webkit-user-drag:none}
.steam{position:absolute;left:50%;top:-6px;width:60px;height:60px;margin-left:-30px;pointer-events:none}
.steam i{position:absolute;bottom:0;width:6px;height:34px;border-radius:6px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.95));filter:blur(2px);opacity:0;animation:steam 2.6s ease-out infinite}
.steam i:nth-child(1){left:12px;animation-delay:calc(var(--d) + .6s)}
.steam i:nth-child(2){left:27px;height:44px;animation-delay:calc(var(--d) + 1.3s)}
.steam i:nth-child(3){left:42px;animation-delay:calc(var(--d) + 1.9s)}
@keyframes steam{0%{opacity:0;transform:translateY(10px) scaleX(1)}30%{opacity:.9}100%{opacity:0;transform:translateY(-34px) scaleX(2.2) skewX(14deg)}}
.c-done h3{margin:14px 0 2px;font:400 32px var(--disp)}
.c-done .ono{font:500 13px var(--mono);color:var(--mute);letter-spacing:.2em;direction:ltr}
.steps{list-style:none;margin:22px auto 0;padding:0;max-width:300px;text-align:right}
.steps li{position:relative;padding:0 30px 18px 0;font-size:13px;color:#a19c93;transition:color .4s}
.steps li::before{content:"";position:absolute;right:6px;top:4px;width:10px;height:10px;border-radius:50%;background:#d6d0bd;transition:.4s}
.steps li::after{content:"";position:absolute;right:10.5px;top:16px;bottom:-2px;width:1.5px;background:#d6d0bd}
.steps li:last-child::after{display:none}
.steps li small{display:block;font-size:11px;color:#b3aea5}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:var(--ink);box-shadow:0 0 0 4px rgba(255,210,31,.6)}
.steps li.now::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,210,31,0)}}
.odot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e39a3b;margin-left:7px;animation:pulse2 1.2s ease-in-out infinite}
.odot.ready{background:#2e9b5b;animation:none}
@keyframes pulse2{50%{opacity:.35}}
.obar{display:flex;align-items:center;width:100%;margin:6px 0 2px;padding:11px 14px;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:12.5px;font-weight:500;text-align:right}
.obar span{margin-right:auto;font-size:11.5px;color:var(--mute)}
.acts2{display:flex;gap:10px;margin-top:18px}
.wa{flex:1.5;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:#1f8f4e;color:#fff;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 10px 22px rgba(31,143,78,.28);transition:transform .15s,background .3s}
.wa:active{transform:scale(.97)}
.wa svg{width:20px;height:20px;flex:0 0 auto}
.wa.sent{background:#14532f}
.c-done .again{flex:1;height:50px;border-radius:14px;background:transparent;color:var(--ink);border:1px solid rgba(27,24,20,.25);font-size:13.5px;font-weight:600}
.wa-note{font-size:11.5px;color:var(--mute);margin-top:10px;line-height:1.7}
.wa-note b{color:var(--ink);font-family:var(--mono);font-weight:500}
.done-rc{margin:24px 4px 0;text-align:right}
@media (max-width:759px){
  #cart{left:0;right:0;bottom:0;top:28px;border-radius:24px 24px 0 0;transform:translateY(104%)}
  #cart .grab{display:block;width:40px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin:10px auto -6px}
}
@media (min-width:760px){
  #cart{top:0;bottom:0;left:0;width:460px;transform:translateX(-104%)}
  #cart .grab{display:none}
}
body.cart #cart{transform:none}
/* ---------- preloader: counter 0→100, then the yellow splits open from a thin slit ---------- */
#pre{position:fixed;inset:0;z-index:200;pointer-events:auto}
#pre .half{position:absolute;left:0;right:0;height:50.2%;background:var(--doodle) 0 0/260px 260px,var(--yel);transition:transform 1.05s cubic-bezier(.76,0,.24,1)}
#pre .half.t{top:0}
#pre .half.b{bottom:0;background-position:0 -50vh,0 0}
#pre .half.t::after,#pre .half.b::after{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 30%,#fff 70%,rgba(255,255,255,0));opacity:0;transition:opacity .25s}
#pre .half.t::after{bottom:0}#pre .half.b::after{top:0}
#pre.slit .half.t{transform:translateY(-3px)}#pre.slit .half.b{transform:translateY(3px)}
#pre.slit .half::after{opacity:1}
#pre.open .half.t{transform:translateY(-101%)}#pre.open .half.b{transform:translateY(101%)}
#pre.open .half::after{opacity:0;transition-delay:.3s}
#pre .ui{position:absolute;inset:0;z-index:2;transition:opacity .35s}
#pre.slit .ui{opacity:0}
#pre .p-logo{position:absolute;top:22px;right:20px;height:24px;width:auto}
#pre .p-tag{position:absolute;bottom:30px;left:20px;font-size:11px;color:rgba(27,24,20,.6)}
#pre .p-tag b{display:block;font:500 10px var(--mono);letter-spacing:.2em;direction:ltr;text-align:left;margin-top:2px}
#pre .p-num{position:absolute;bottom:14px;right:18px;left:18px;display:flex;align-items:flex-end;gap:12px;color:var(--ink)}
#pre .p-num span{font:300 clamp(110px,34vw,250px)/.85 var(--ui);letter-spacing:-.04em;direction:ltr;font-variant-numeric:tabular-nums;min-width:1.15em;text-align:right}
/* the words get written in as the count climbs */
#pre .p-lbl{padding-bottom:.6em;font-size:clamp(110px,34vw,250px);line-height:1;white-space:nowrap;clip-path:inset(0 0 0 calc((1 - var(--p,0)) * 100%))}
#pre .p-lbl b{display:block;font:400 .3em/1 var(--disp)}
#pre .p-lbl small{display:block;font:600 .1em/1.2 var(--ui);margin-top:.12em;opacity:.75}
#pre .p-bar{position:absolute;left:20px;right:20px;top:58px;height:2px;background:rgba(27,24,20,.12);overflow:hidden}
#pre .p-bar i{position:absolute;inset:0;background:var(--ink);transform-origin:right;transform:scaleX(var(--p,0))}
#pre.gone{display:none}

/* branch picker */
.brn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--ink);text-align:right;box-shadow:0 4px 14px rgba(0,0,0,.06)}

@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
#bsheet{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--doodle) 0 0/260px 260px,var(--cream);transform:translateY(102%);transition:transform .5s var(--ease)}
#cart.picking #bsheet{transform:none}
.b-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.b-head h3{margin:0;font:400 28px var(--disp)}
.b-head h3 small{font:12px var(--mono);color:var(--mute);margin-right:8px}
.b-tools{padding:0 18px}

.b-search:focus{border-color:var(--ink)}
.b-near{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:10px;border-radius:14px;background:var(--ink);color:var(--yel);font-size:13px;font-weight:600}
.b-cities{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.b-cities::-webkit-scrollbar{display:none}

.b-cities button.on{background:var(--yel);border-color:var(--ink);font-weight:700}
.b-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 24px;scrollbar-width:none;touch-action:pan-y}

.b-row small{display:block;font-size:11px;color:var(--mute)}

.b-none{text-align:center;color:var(--mute);font-size:13px;padding:30px 0}

#toast{position:fixed;z-index:60;left:50%;top:66px;transform:translate(-50%,-10px);opacity:0;transition:.3s var(--ease);background:var(--ink);color:var(--yel);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:999px;pointer-events:none;white-space:nowrap}

<div id="pre" aria-hidden="true">

  el.className = 'item'; el.dataset.s = s;
  el.innerHTML = `<img class="art" src="${D.img}" alt="${D.name}" draggable="false">${D.isNew ? '<span class="new">جديد</span>' : ''}
    <div class="gcap"><span>${pad(s+1)}</span>${D.name}</div>
    <div class="spots">${D.items.map((it,k) => `
      <button class="spot ${it.x > 52 ? 'l' : 'r'}" data-k="${k}" style="left:${it.x}%;top:${it.y}%;--k:${k}">
        <span class="dot">${pad(k+1)}</span><span class="pill">${it.n}<em>${price(it.p)}</em></span>
      </button>`).join('')}</div>`;
  stage.appendChild(el); els.push(el);
}

/* ---------- state ---------- */
let mode = 'ring', focus = -1, dragging = false, playing = true, lastTouch = 0, active = -1;
const GROUPS = [0, 1].map(g => P.map((_, i) => i).filter(i => P[i].g === g));
const RING = [{rot:0, target:0}, {rot:0, target:0}];
let ag = 0, dragG = 0;
const gOf = s => P[pOf(s)].g;
const iOf = s => GROUPS[gOf(s)].indexOf(pOf(s));
const wrap = (v, n) => ((v % n) + n) % n;
const frontOf = g => GROUPS[g][wrap(Math.round(RING[g].rot), GROUPS[g].length)];
const bandY = g => { const top = 64, bottom = vh - (mobile ? 150 : 120); return top + (bottom - top) * (g ? .8 : .33); };
let vw, vh, mobile, H, SHEET;
const cur = els.map(() => ({x:0, y:0, s:.4, b:0, o:0}));
const cart = new Map();
const inCart = (p, k) => { const c = cart.get(p); return !!c && (k === 0 || c.x.has(k)); };
const cartQty = () => [...cart.values()].reduce((a, c) => a + c.q, 0);
const hOf = s => H * (P[pOf(s)].sz || 1);
const wOf = s => hOf(s) * P[pOf(s)].ar;

function dims(){
  vw = innerWidth; vh = innerHeight; mobile = vw < 760;
  H = mobile ? Math.min(vh*0.25, 215) : Math.min(Math.max(vh*0.3, 230), 310);
  SHEET = Math.round(Math.min(vh*0.5, 450));
  document.documentElement.style.setProperty('--sheet', SHEET+'px');
  els.forEach((el, s) => { el.style.width = wOf(s)+'px'; el.style.height = hOf(s)+'px'; });
}

/* ---------- layouts ---------- */
function ringT(s){
  const g = gOf(s), n = GROUPS[g].length;
  const th = (iOf(s) - RING[g].rot) * 2*Math.PI/n, t = (Math.cos(th) + 1)/2;
  const cy = bandY(g);
  const Rx = (mobile ? vw*0.36 : Math.min(vw*0.3, 440)) * (g ? .85 : 1);
  const lift = H * (g ? .32 : .42);
  return {x: vw/2 - Math.sin(th)*Rx, y: cy - (1-t)*lift, s: .46 + .54*t, b: (1-t)*3.6, o: .38 + .62*t, z: Math.round(t*100)};
}
function gridT(s){
  const p = pOf(s), cols = mobile ? 2 : 4, rows = Math.ceil(N/cols);
  const top = 72, bottom = vh - 30, areaW = Math.min(vw - 24, 1100), left = (vw - areaW)/2;
  const cw = areaW/cols, ch = (bottom - top)/rows, r = Math.floor(p/cols), c = p % cols;
  const sc = Math.min(cw*0.8/wOf(s), (ch - 34)*0.88/hOf(s));
  return {x: left + (cols-1-c+.5)*cw, y: top + r*ch + (ch-26)/2, s: sc, b:0, o:1, z:10};
}
function focusT(s){
  const w = wOf(s);
  if (mobile){
    const top = 112, bottom = vh - SHEET - 36;
    const sc = Math.min((bottom - top)/hOf(s), vw*(wide(pOf(s)) ? .86 : .66)/w);
    return {x: vw/2, y: (top+bottom)/2, s: sc, b:0, o:1, z:300};
  }
  const left = 390, right = vw - 30, top = 130, bottom = vh - 56;
  const sc = Math.min((bottom - top)/hOf(s), (right - left)*(wide(pOf(s)) ? .72 : .52)/w, 2.2);
  return {x: (left+right)/2, y: (top+bottom)/2, s: sc, b:0, o:1, z:300};
}
function target(s){
  if (focus === s) return focusT(s);
  const t = mode === 'ring' ? ringT(s) : gridT(s);
  if (focus >= 0){ t.o = Math.min(t.o, .1); t.b = 9; t.z = Math.min(t.z, 99); }
  return t;
}

/* ---------- loop ---------- */
function tick(){
  RING.forEach((r, g) => { if (!(dragging && dragG === g)) r.rot += (r.target - r.rot) * .12; });
  for (let s = 0; s < SLOTS; s++){
    const t = target(s), c = cur[s], k = .14, el = els[s], w = wOf(s);
    c.x += (t.x - c.x)*k; c.y += (t.y - c.y)*k; c.s += (t.s - c.s)*k; c.b += (t.b - c.b)*k; c.o += (t.o - c.o)*k;
    el.style.transform = `translate3d(${(c.x - w/2).toFixed(2)}px,${(c.y - hOf(s)/2).toFixed(2)}px,0) scale(${c.s.toFixed(4)})`;
    el.style.opacity = c.o.toFixed(3);
    el.style.visibility = c.o < .01 ? 'hidden' : 'visible';
    const bl = c.b > .08 ? `blur(${c.b.toFixed(2)}px)` : 'none';
    if (el._bl !== bl){ el.style.filter = bl; el._bl = bl; }
    if (el._z !== t.z){ el.style.zIndex = t.z; el._z = t.z; }
    const inv = (1/c.s).toFixed(3);
    if (el._inv !== inv){ el.style.setProperty('--inv', inv); el._inv = inv; }
  }
  const a = frontOf(ag);
  if (a !== active){ active = a; updateDock(); }
  bands();
  layoutSpec();
  requestAnimationFrame(tick);
}

/* ---------- spec callouts ---------- */
function buildSpec(p){
  const D = P[p], total = D.items.reduce((a, it) => a + it.p, 0);
  $('#spLabels').innerHTML = D.items.map((it, k) => `<button class="sp-l" data-k="${k}" style="--k:${k}">
      <b>${k ? it.n : D.name}</b><span>${it.d}</span><em>${it.p === 0 ? 'مجاناً' : (k ? '+ ' : '') + it.p + ' ر.س'}</em></button>`).join('');
  $('#spLines').innerHTML = D.items.map((_, k) => `<polyline data-k="${k}" style="--k:${k}"/><circle data-k="${k}" r="3.5" style="--k:${k}"/>`).join('');
  $('#spStamp').innerHTML = `<small>مع الإضافات</small><b>${fmt(total)}</b><small>ر.س</small>`;
  $('#spHead').innerHTML = `<b class="stk">${D.name}</b><span class="sp-pill">${D.cat}</span>
    <p>${D.g ? 'ينخبز على الصاج قدامك.<br>حار ومقرمش.<br>من معصوبي.' : 'طعم تراثنا.<br>بلمسة جديدة.<br>من معصوبي.'}</p>`;
  const sp = $('#spec'); sp.classList.remove('in'); void sp.offsetWidth; sp.classList.add('in');
}
function layoutSpec(){
  if (mode !== 'ring' || focus >= 0 || active < 0) return;
  const s = active, c = cur[s], D = P[pOf(s)];
  const w = wOf(s)*c.s, h = hOf(s)*c.s, L = c.x - w/2, T = c.y - h/2;
  const LW = mobile ? Math.max(84, Math.min(118, (vw - w)/2 - 22)) : 190;
  const colR = mobile ? vw - 10 - LW : Math.min(vw - LW - 24, L + w + 80);
  const colLe = mobile ? 10 + LW : Math.max(24 + LW, L - 80);
  const maxY = vh - (mobile ? 170 : 140), LH = mobile ? 54 : 62;
  const sides = {l: [], r: []};
  D.items.forEach((it, k) => { const px = L + it.x/100*w, py = T + it.y/100*h; (it.x >= 50 ? sides.r : sides.l).push({k, px, py}); });
  const labs = $('#spLabels').children, lines = $('#spLines').querySelectorAll('polyline'), dots = $('#spLines').querySelectorAll('circle');
  if (labs.length !== D.items.length) return;
  let lowestL = T + h*.6;
  ['l', 'r'].forEach(side => {
    const arr = sides[side].sort((a, b) => a.py - b.py);
    let prev = -1e9; arr.forEach(o => { o.ly = Math.max(o.py, prev + LH, 96); prev = o.ly; });
    const over = arr.length ? arr[arr.length - 1].ly - maxY : 0; if (over > 0) arr.forEach(o => o.ly -= over);
    arr.forEach(o => {
      const el = labs[o.k]; el.style.setProperty('--lw', LW + 'px');
      const bw = el.offsetWidth || LW;
      const x = side === 'r' ? colR : colLe - bw;
      el.style.transform = `translate(${x.toFixed(1)}px,${(o.ly - 12).toFixed(1)}px)`;
      const edge = side === 'r' ? x - 6 : colLe + 6, elbow = side === 'r' ? Math.max(o.px + 12, edge - 26) : Math.min(o.px - 12, edge + 26);
      lines[o.k].setAttribute('points', `${o.px.toFixed(1)},${o.py.toFixed(1)} ${elbow.toFixed(1)},${o.ly.toFixed(1)} ${edge.toFixed(1)},${o.ly.toFixed(1)}`);
      dots[o.k].setAttribute('cx', o.px.toFixed(1)); dots[o.k].setAttribute('cy', o.py.toFixed(1));
      if (side === 'l') lowestL = Math.max(lowestL, o.ly + 46);
    });
  });
  const st = $('#spStamp'), sw = st.offsetWidth || 90;
  const sx = mobile ? 12 : colLe - sw - 10, sy = Math.min(maxY + 4, Math.max(lowestL + 6, T + h*.68));
  st.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(-8deg)`;
}
$('#spLabels').addEventListener('click', e => { const b = e.target.closest('.sp-l'); if (b && !justClosed()) openFocus(active, +b.dataset.k); });
$('#spStamp').addEventListener('click', () => { if (!justClosed()) openFocus(active); });

function updateDock(){
  const p = pOf(active), D = P[p];
  $('#idx').textContent = `${pad(p+1)} / ${pad(N)}`;
  const dn = $('#dname'); dn.innerHTML = `${D.name}<small>${D.en}</small>`;
  dn.classList.remove('swap'); void dn.offsetWidth; dn.classList.add('swap');

}
(function shapes(){
  let v = 7; const r = () => { v = (v*9301 + 49297) % 233280; return v/233280; };
  let d = 'M0 0H200V' + (4 + r()*4).toFixed(1);
  for (let x = 200; x > 0;){ x -= .8 + r()*2.6; d += `L${Math.max(0,x).toFixed(1)} ${(1.5 + r()*7.5).toFixed(1)}`; }
  d += 'Z';
  const torn = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 10' preserveAspectRatio='none'><path d='${d}'/></svg>`;
  document.documentElement.style.setProperty('--torn', `url("data:image/svg+xml;utf8,${encodeURIComponent(torn)}")`);
  // scalloped white price sticker
  let s = ''; const n = 15;
  for (let i = 0; i <= 360; i += 3){
    const a = i*Math.PI/180, rr = 46 + 3.2*Math.cos(a*n) + 1.2*Math.sin(a*4 + 1);
    s += (i ? 'L' : 'M') + (50 + rr*Math.cos(a)).toFixed(1) + ' ' + (50 + rr*Math.sin(a)).toFixed(1);
  }
  const sc = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='${s}Z' fill='#fff'/></svg>`;
  document.documentElement.style.setProperty('--scallop', `url("data:image/svg+xml;utf8,${encodeURIComponent(sc)}")`);
})();
function bands(){
  for (let g = 0; g < 2; g++){
    const b = document.getElementById('band' + g), y = Math.max(g ? 0 : 84, Math.round(bandY(g) - H*(g ? .62 : .98)));
    if (b._y !== y){ b.style.top = y + 'px'; b._y = y; }
    b.classList.toggle('on', g === ag);
  }
}
document.querySelectorAll('.band').forEach(b => b.addEventListener('click', () => { ag = +b.dataset.g; lastTouch = Date.now(); }));
function syncPlay(){ $('#play').innerHTML = playing ? '<svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.4" height="8"/><rect x="6.1" y="1" width="2.4" height="8"/></svg>' : '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>'; }
$('#play').addEventListener('click', () => { playing = !playing; syncPlay(); });
setInterval(() => {
  if (playing && mode === 'ring' && focus < 0 && !dragging && Date.now() - lastTouch > 4000){ RING[0].target += 1; RING[1].target += 1; }
}, 3400);

/* ---------- focus ---------- */
let spotT, closedAt = 0, curSpot = 0;
const justClosed = () => Date.now() - closedAt < 450;
const nearest = s => { const g = gOf(s), n = GROUPS[g].length, r = RING[g].rot; return r + ((((iOf(s) - r) % n) + n + n/2) % n - n/2); };
function openFocus(s, startK = 0){
  focus = s; lastTouch = Date.now(); ag = gOf(s); RING[ag].target = Math.round(nearest(s));
  const p = pOf(s), D = P[p];
  document.body.classList.add('focus');
  $('#ftitle').innerHTML = `<span>${pad(p+1)}.</span>${D.name}`;
  const tint = $('#tint'); tint.style.backgroundColor = D.tint;
  const f = focusT(s); tint.style.left = f.x+'px'; tint.style.top = f.y+'px';
  buildReceipt(p);
  clearTimeout(spotT);
  spotT = setTimeout(() => { els[s].classList.add('spots-on'); document.body.classList.add('hot'); setSpot(startK); }, 520);
}
function closeFocus(){
  if (focus < 0) return;
  els[focus].classList.remove('spots-on');
  els[focus].querySelectorAll('.spot').forEach(x => x.classList.remove('on'));
  document.body.classList.remove('focus','hot');
  const tint = $('#tint'); tint.style.left = ''; tint.style.top = ''; tint.style.backgroundColor = P[pOf(active)].tint;
  focus = -1; clearTimeout(spotT); lastTouch = closedAt = Date.now();
}
function setSpot(k){
  if (focus < 0) return;
  curSpot = k;
  els[focus].querySelectorAll('.spot').forEach(x => x.classList.toggle('on', +x.dataset.k === k));
  document.querySelectorAll('.rc-row').forEach(r => r.classList.toggle('hl', +r.dataset.k === k));
  const row = document.querySelector(`.rc-row[data-k="${k}"]`), rc = $('#receipt');
  if (row && rc.scrollHeight > rc.clientHeight){
    const rt = row.offsetTop - 40;
    if (rt < rc.scrollTop || rt + row.offsetHeight + 60 > rc.scrollTop + rc.clientHeight) rc.scrollTo({top: rt, behavior:'smooth'});
  }
}

/* ---------- ticket ---------- */
function barcode(seed){
  let x = 0, r = '', v = seed*9301 + 49297;
  const rand = () => { v = (v*9301 + 49297) % 233280; return v/233280; };
  while (x < 296){ const w = 1 + Math.floor(rand()*3.2); if (rand() > .38) r += `<rect x="${x}" y="0" width="${w}" height="48"/>`; x += w + (rand() > .5 ? 1 : 2); }
  return `<svg class="barcode" viewBox="0 0 296 48" preserveAspectRatio="none" fill="#1b1814">${r}</svg>`;
}
function buildReceipt(p){

  const allIn = D.items.every((_,k) => inCart(p, k));

  $('#receipt').innerHTML = `<div class="tk">
    <div class="tk-top">
      <img class="tk-img ${wide(p) ? 'wide' : ''}" src="${D.img}" alt="" draggable="false">

      <div class="tk-frame">
        <div class="tk-head"><span>${D.cat} · معصوبي</span><span class="tk-no">№ ${pad(p+1)}</span></div>
        <div class="tk-name">${D.name}</div>
        <div class="tk-en">${D.en}</div>

    </div>
    <div class="tk-perf top-c"></div>
    <div class="tk-paper" style="position:relative">
      <div class="tk-stamp"><div><b>معصوبي</b><small>MASOOBI</small></div></div>
      <div class="tk-body">
        <div class="tk-sec"><span>EXTRAS</span><span>QTY 1</span></div>
        ${D.items.map((it,k) => `<div class="rc-row" data-k="${k}">${add(k)}<div class="tk-it"><b>${it.n}</b><small>${it.d}</small></div><span class="tk-p">${it.p === 0 ? 'مجاناً' : it.p}</span></div>`).join('')}
        <div class="tk-tot"><b>الإجمالي</b><i></i><span>${fmt(total)}</span><small>ر.س</small></div>
        <div class="tk-vat">شامل ضريبة القيمة المضافة 15%</div>
        <button class="rc-cta ${allIn?'done':''}">${allIn ? '✓ الطلب كامل في سلتك' : 'أضفه بكل الإضافات <span>←</span>'}</button>
      </div>
    </div>
    <div class="tk-perf tk-paper"></div>
    <div class="tk-stub tk-paper">${barcode(p+5)}<div><b>${serial}</b><small>قسيمة الاستلام — احتفظ بها</small></div></div>
  </div>`;
}
$('#receipt').addEventListener('click', e => {
  if (focus < 0) return;
  const p = pOf(focus);
  const add = e.target.closest('.rc-add'), cta = e.target.closest('.rc-cta'), row = e.target.closest('.rc-row');
  if (add){ addToBag(p, +add.dataset.k); return; }
  if (cta){ P[p].items.forEach((_,k) => addToBag(p, k, true)); toast(`انضاف ${P[p].name} بكل إضافاته`); return; }
  if (row) setSpot(+row.dataset.k);
});
function addToBag(p, k, quiet){
  if (inCart(p, k)){ if (!quiet) toast('موجودة في سلتك'); return; }
  let c = cart.get(p);
  if (!c){ c = {q:1, x:new Set()}; cart.set(p, c); lastAdded = p; }
  if (k > 0) c.x.add(k);
  syncBag();
  if (focus >= 0){ const st = $('#receipt').scrollTop; buildReceipt(p); $('#receipt').scrollTop = st; setSpot(k); }
  if (!quiet) toast(k === 0 ? `انضاف: ${P[p].name}` : `انضاف: ${P[p].items[k].n} مع ${P[p].name}`);
}
function syncBag(){
  const b = $('#bag'), n = cartQty();
  b.innerHTML = n || !order ? `السلة (${n})` : `<i class="odot ${stepNow() === 2 ? 'ready' : ''}"></i>طلبك #${order.no}`;

}

/* ================= BRANCHES ================= */
const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.6c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .4-.1.6l-.5.6c-.1.1-.1.3 0 .5.6 1 1.4 1.8 2.4 2.4.2.1.4.1.5 0l.6-.6c.2-.2.4-.2.6-.1l1.6.7c.2.1.4.3.4.5v.5c0 .3-.1.6-.4.8-.6.4-1.4.6-2.2.4-2.6-.7-4.8-2.9-5.4-5.5-.2-.7 0-1.5.4-2.2z" fill="currentColor"/></svg>';

const bLabel = b => `فرع ${b.name}`;

async function buildReceiptImage(o){

  y += 50;

  y += 32; dash(y);
  y += 96;
  o.lines.forEach(l => {
    leader(`${P[l.p].name}  × ${l.q}`, `${fmt(l.amt)} SR`, y, '600 36px "IBM Plex Sans Arabic"', '700 34px "Courier Prime"');
    l.x.forEach(k => { y += 56; const it = P[l.p].items[k]; leader(`+ ${it.n}`, it.p ? `${it.p * l.q}` : '—', y, '400 29px "IBM Plex Sans Arabic"', '400 30px "Courier Prime"'); });
    y += 74;

  y -= 20; dash(y);

  if (o.fee){ y += 56; leader('رسوم التوصيل', `${o.fee} SR`, y, '500 32px "IBM Plex Sans Arabic"', '400 32px "Courier Prime"'); }
  y += 84;

  y += 44; ar('شامل ضريبة القيمة المضافة 15%', R, y, '400 24px "IBM Plex Sans Arabic"', '#6e6a63');
  y += 62;
  ar(`الفرع: ${bLabel(o.br)}`, W/2, y, '700 28px "IBM Plex Sans Arabic"', INK, 'center'); y += 46;
  ar(`الاستلام: ${o.howL}   ·   الوقت: ${o.whenL}   ·   الدفع: ${o.pay}`, W/2, y, '500 25px "IBM Plex Sans Arabic"', '#55514b', 'center');
  if (o.note){ y += 46; ar(`ملاحظة: ${o.note}`, W/2, y, '500 25px "IBM Plex Sans Arabic"', '#55514b', 'center'); }
  y += 50; const bw = 470, bx = (W - bw)/2; let x = bx; g.fillStyle = INK;
  while (x < bx + bw){ const w = 2 + Math.floor(rnd()*5); if (rnd() > .35) g.fillRect(x, y, w, 120); x += w + 2 + (rnd() > .5 ? 2 : 0); }
  y += 250;

  g.strokeText('بالعافية!', 0, 0); g.fillStyle = INK; g.fillText('بالعافية!', 0, 0); g.restore();
  en('tel. ' + waShow(o.br.wa), L, Y1 - 44, '700 28px "Courier Prime"', INK);
  en('MASOOBI', R, Y1 - 44, '700 26px "Courier Prime"', INK, 'right');
  return new Promise(res => c.toBlob(res, 'image/png'));
}
/* WhatsApp message: a tiny monospace receipt in plain ASCII, so the link stays short */
function waLink(){
  const W = 24, L = [];
  const row = (l, r) => l + '.'.repeat(Math.max(2, W - l.length - r.length)) + r;
  const how  = {pick:'PICKUP', car:'CURBSIDE', deliver:'DELIVERY'}[order.howK];
  const when = {now:'NOW', '15':'IN 15 MIN', '30':'IN 30 MIN'}[order.whenK];
  const pay  = {apple:'APPLE PAY', mada:'MADA', cash:'CASH'}[order.payK];
  L.push('```');
  L.push(`MASOOBI          #${order.no}`);
  L.push('-'.repeat(W));
  order.lines.forEach(l => {
    L.push(row(`${l.q}x ${P[l.p].en}`, fmt(l.amt)));
    if (l.x.length) L.push(' +' + l.x.map(k => P[l.p].items[k].e).join(' +'));
  });
  L.push('-'.repeat(W));
  if (order.fee) L.push(row('DELIVERY', String(order.fee)));
  L.push(row('TOTAL', fmt(Math.round(order.total*100)/100) + ' SR'));
  L.push(`${how} / ${when}`);
  L.push(pay);
  L.push('```');
  L.push('📍 ' + bLabel(order.br));
  L.push(order.lines.map(l => `${l.q}× ${P[l.p].name}` + (l.x.length ? ` (${l.x.map(k => P[l.p].items[k].n).join('، ')})` : '')).join('\n'));
  if (order.note) L.push('📝 ' + order.note);
  return `https://wa.me/${order.br.wa}?text=${encodeURIComponent(L.join('\n'))}`;
}
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------- input ---------- */
let sx = 0, sRot = 0, moved = false, downEl = null;
stage.addEventListener('pointerdown', e => {
  dragG = e.clientY > (bandY(0) + bandY(1)) / 2 ? 1 : 0;
  sx = e.clientX; sRot = RING[dragG].target; moved = false; downEl = e.target; lastTouch = Date.now();
  if (mode === 'ring' && focus < 0){ dragging = true; stage.classList.add('drag'); try{ stage.setPointerCapture(e.pointerId); }catch(_){} }
});
stage.addEventListener('pointermove', e => {
  const dx = e.clientX - sx;
  if (Math.abs(dx) > 6) moved = true;
  if (dragging && moved){ RING[dragG].target = RING[dragG].rot = sRot + dx / (mobile ? 85 : 140); ag = dragG; }
});
function up(){ if (dragging){ dragging = false; stage.classList.remove('drag'); RING[dragG].target = Math.round(RING[dragG].target); } }
stage.addEventListener('pointerup', () => {
  const wasMoved = moved; up();
  if (wasMoved) return;
  const spot = downEl && downEl.closest('.spot');
  if (spot && focus >= 0){ setSpot(+spot.dataset.k); return; }
  const it = downEl && downEl.closest('.item');
  if (focus >= 0){ if (!it || +it.dataset.s !== focus) closeFocus(); return; }
  if (!it) return;
  const s = +it.dataset.s, g = gOf(s); ag = g;
  if (mode === 'grid' || s === frontOf(g)) openFocus(s);
  else RING[g].target = Math.round(nearest(s));
});
stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => {
  if (mode !== 'ring' || focus >= 0) return; e.preventDefault(); lastTouch = Date.now();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) > 4) RING[ag].target = Math.round(RING[ag].target) + Math.sign(d);
}, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('cart')){ closeCart(); return; }
  if (e.key === 'Escape') closeFocus();
  if (focus >= 0 || mode !== 'ring') return;
  if (e.key === 'ArrowLeft'){ RING[ag].target = Math.round(RING[ag].target) + 1; lastTouch = Date.now(); }
  if (e.key === 'ArrowRight'){ RING[ag].target = Math.round(RING[ag].target) - 1; lastTouch = Date.now(); }
  if (e.key === 'ArrowUp'){ ag = 0; lastTouch = Date.now(); }
  if (e.key === 'ArrowDown'){ ag = 1; lastTouch = Date.now(); }
  if (e.key === 'Enter') openFocus(active);
});
$('#close').addEventListener('click', closeFocus);
$('#shop').addEventListener('click', () => { if (!justClosed()) openFocus(active); });
document.querySelectorAll('#toggle button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.m; lastTouch = Date.now();
  if (mode === 'grid') RING.forEach(r => r.target = Math.round(r.target));
  document.querySelectorAll('#toggle button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('grid', mode === 'grid');
}));

/* ---------- boot ---------- */
dims();
const enter = () => { for (let s = 0; s < SLOTS; s++){ const t = ringT(s); Object.assign(cur[s], t, {y: t.y + 60, o: 0, s: t.s*.9}); } };
enter();
syncPlay();
(function preloader(){
  const pre = $('#pre'), num = $('#pNum'), bar = pre.querySelector('.p-bar'), lbl = $('#pLbl'), MAX = BRANCH_COUNT;
  const DUR = 2300, t0 = performance.now();
  let fontsOk = false; (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => fontsOk = true);
  setTimeout(() => fontsOk = true, 4000);                       // never wait forever on slow fonts
  const ease = t => 1 - Math.pow(1 - t, 4);                      // fast start, slows near 100
  (function step(now){
    let t = Math.min(1, (now - t0) / DUR);
    let v = Math.floor(ease(t) * MAX);
    if (v >= MAX - 1 && !fontsOk) v = MAX - 1;
    num.textContent = v; bar.style.setProperty('--p', v / MAX);
    lbl.style.setProperty('--p', Math.min(1, ease(t) * 1.15).toFixed(3));
    if (v < MAX) return requestAnimationFrame(step);
    lastTouch = Date.now();
    setTimeout(() => {
      pre.classList.add('slit');
      setTimeout(() => { enter(); pre.classList.add('open'); }, 380);
      setTimeout(() => { pre.classList.add('gone'); lastTouch = Date.now(); }, 1500);
    }, 650);
  })(t0);
})();
addEventListener('resize', () => { dims(); if (focus >= 0){ const f = focusT(focus); $('#tint').style.left = f.x+'px'; $('#tint').style.top = f.y+'px'; } });
requestAnimationFrame(tick);
})();
